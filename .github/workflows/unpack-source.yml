name: Unpack WG Clean source

on:
  push:
    branches:
      - feat/wg-clean-app
    paths:
      - '.bootstrap/**'
      - '.github/workflows/unpack-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/wg-clean-app
          fetch-depth: 0

      - name: Decode and unpack source
        shell: bash
        run: |
          test -f .bootstrap/part05.b64
          cat .bootstrap/part*.b64 > /tmp/wg-clean-source.b64
          base64 --decode /tmp/wg-clean-source.b64 > /tmp/wg-clean-source.zip
          unzip -o /tmp/wg-clean-source.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/unpack-source.yml

      - name: Commit organized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add complete WG Clean application" || exit 0
          git push origin HEAD:feat/wg-clean-app
